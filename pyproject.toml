[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cctv"
version = "0.1.0"
description = "AI CCTV client and streaming utilities"
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
edge-node = [
    "pygobject",
]
edge-pi = [
    "pygobject",
]
ai-server = [
    "transformers>=4.51.0",
    "accelerate",
    "pillow",
    "qwen-vl-utils",
    "bitsandbytes",
    "opencv-python",
    "ultralytics",
    "numpy",
    "matplotlib",
    "scipy",
    "pyyaml",
    "requests",
    "psutil",
    "insightface",
    "onnxruntime",
    "discord.py>=2.0.0",
    "PyQt5",
]
windows-server = [
    "transformers>=4.51.0",
    "accelerate",
    "pillow",
    "qwen-vl-utils",
    "bitsandbytes",
    "opencv-python",
    "ultralytics",
    "numpy",
    "matplotlib",
    "scipy",
    "pyyaml",
    "requests",
    "psutil",
    "insightface",
    "onnxruntime",
    "discord.py>=2.0.0",
    "PyQt5",
]
edge = [
    "pygobject",
]
vision-demo = [
    "mediapipe",
    "torch",
]

[project.scripts]
ai-cctv = "ai_cctv.ai_server.main:main"
ai-cctv-edge = "ai_cctv.edge_node.main:main"
ai-cctv-windows-server = "ai_cctv.ai_server.main:main"

[tool.setuptools.packages.find]
where = ["src"]
